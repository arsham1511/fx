name: Ultimate Shader Heist 🥷

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Requests
        run: pip install requests

      - name: Stealthy Download Script
        run: |
          python - <<EOF
          import requests
          import os

          url = "https://www.sonicether.com/download/seus-renewed-v1-0-1/?wpdmdl=2144"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Referer": "https://www.sonicether.com/seus/",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
              "Connection": "keep-alive",
              "Upgrade-Insecure-Requests": "1"
          }

          session = requests.Session()
          # اول یه بار صفحه اصلی رو می‌بینیم که کوکی بده
          session.get("https://www.sonicether.com/seus/", headers=headers)
          
          # حالا تلاش برای دانلود فایل
          response = session.get(url, headers=headers, stream=True)
          
          if response.status_code == 200 and 'zip' in response.headers.get('Content-Type', ''):
              with open("SEUS-Renewed-v1.0.1.zip", 'wb') as f:
                  for chunk in response.iter_content(chunk_size=8192):
                      f.write(chunk)
              print("Successfully downloaded the ZIP file!")
          else:
              print(f"Failed! Content-Type: {response.headers.get('Content-Type')}")
              print("The site is still blocking us. It's time to admit they have better security than NASA!")
              exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "ShaderBot-2000"
          git config --global user.email "actions@github.com"
          git add SEUS-Renewed-v1.0.1.zip
          git diff --quiet && git diff --staged --quiet || git commit -m "Managed to bypass the security! 🎮"
          git push
